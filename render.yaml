# Configuración de Render Blueprint
databases:
  - name: dientesbot-db
    plan: free
    postgresMajorVersion: "15"

services:
  - type: web
    name: dientesbot-api
    env: node
    plan: free
    buildCommand: pnpm install && node ./node_modules/.pnpm/ffmpeg-static@5.3.0/node_modules/ffmpeg-static/install.js && pnpm --filter @workspace/db run push && npx tsx lib/db/src/seed.ts && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dientesbot-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
